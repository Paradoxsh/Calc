<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scientific Calculator</title>
<style>
  :root {
    --bg1: #eef1ff;
    --bg2: #e6f6f3;
    --card: rgba(255, 255, 255, 0.82);
    --card-border: rgba(255, 255, 255, 0.9);
    --shadow: 0 30px 60px -20px rgba(60, 64, 140, 0.35), 0 8px 20px -8px rgba(30, 30, 80, 0.15);
    --text: #1b1e3a;
    --muted: #7b809e;
    --display-bg: #14172e;
    --display-text: #f4f5ff;
    --display-muted: #8e93bd;

    --num-bg: #ffffff;
    --num-text: #1b1e3a;
    --num-shadow: #d9dcee;

    --op-bg: #e7e9ff;
    --op-text: #4338ca;
    --op-shadow: #c9ccf5;

    --fn-bg: #dcf3ee;
    --fn-text: #0f766e;
    --fn-shadow: #b8e2da;

    --clr-bg: #ffe3e7;
    --clr-text: #be123c;
    --clr-shadow: #f7c3cb;

    --eq-from: #6366f1;
    --eq-to: #8b5cf6;
    --eq-shadow: #4f46e5;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #0f1124;
      --bg2: #0d1f26;
      --card: rgba(28, 31, 58, 0.8);
      --card-border: rgba(255, 255, 255, 0.07);
      --shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
      --text: #eceeff;
      --muted: #8e93bd;
      --display-bg: #0a0b18;

      --num-bg: #2a2e55;
      --num-text: #f1f2ff;
      --num-shadow: #1a1d3a;

      --op-bg: #3b3f86;
      --op-text: #c7caff;
      --op-shadow: #272a5e;

      --fn-bg: #14463f;
      --fn-text: #7ff0dc;
      --fn-shadow: #0d2f2b;

      --clr-bg: #5a1f2e;
      --clr-text: #ffb3c1;
      --clr-shadow: #3d1520;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; margin: 0; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 10% 0%, var(--bg1), transparent 60%),
      radial-gradient(900px 600px at 100% 100%, var(--bg2), transparent 60%),
      var(--bg1);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }

  .calc {
    width: min(100%, 400px);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 2px 4px 12px;
  }

  .title {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .deg-chip {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--fn-text);
    background: var(--fn-bg);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .display {
    background: var(--display-bg);
    color: var(--display-text);
    border-radius: 20px;
    padding: 16px 20px 14px;
    margin-bottom: 16px;
    min-height: 116px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    overflow: hidden;
    box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.45);
  }

  .prev {
    min-height: 1.4em;
    font-size: 0.95rem;
    color: var(--display-muted);
    max-width: 100%;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }
  .prev::-webkit-scrollbar { display: none; }

  .main {
    margin-top: 4px;
    font-size: 2.4rem;
    font-weight: 600;
    line-height: 1.2;
    max-width: 100%;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
    font-variant-numeric: tabular-nums;
    transition: font-size 0.15s ease;
  }
  .main::-webkit-scrollbar { display: none; }
  .main.s1 { font-size: 1.9rem; }
  .main.s2 { font-size: 1.5rem; }
  .main.error { color: #ff8a9b; }

  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    line-height: 1.1;
    font-size: 0.85em;
    margin-left: 4px;
  }
  .frac .n { padding: 0 6px 2px; border-bottom: 2px solid currentColor; }
  .frac .d { padding: 2px 6px 0; }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    font: inherit;
    border: 0;
    cursor: pointer;
    height: 56px;
    border-radius: 16px;
    font-size: 1.2rem;
    font-weight: 600;
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  button:hover { transform: translateY(-1px); filter: brightness(1.04); }
  button:active, button.pressed { transform: scale(0.92); filter: brightness(0.96); }
  button:focus-visible { outline: 3px solid #6366f1; outline-offset: 2px; }

  .num { background: var(--num-bg); color: var(--num-text); box-shadow: 0 3px 0 var(--num-shadow); }
  .op  { background: var(--op-bg);  color: var(--op-text);  box-shadow: 0 3px 0 var(--op-shadow); font-size: 1.35rem; }
  .fn  { background: var(--fn-bg);  color: var(--fn-text);  box-shadow: 0 3px 0 var(--fn-shadow); font-size: 1rem; }
  .clr { background: var(--clr-bg); color: var(--clr-text); box-shadow: 0 3px 0 var(--clr-shadow); }
  .eq  {
    background: linear-gradient(135deg, var(--eq-from), var(--eq-to));
    color: #fff;
    box-shadow: 0 3px 0 var(--eq-shadow);
    font-size: 1.5rem;
  }

  button:active, button.pressed { box-shadow: 0 1px 0 rgba(0, 0, 0, 0.1); }

  .span2 { grid-column: span 2; }

  .legend {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .legend span::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    background: var(--c);
  }

  @media (max-width: 360px) {
    .calc { padding: 12px; border-radius: 22px; }
    .keys { gap: 8px; }
    button { height: 50px; font-size: 1.05rem; }
    .main { font-size: 2rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    button, .main { transition: none; }
    button:hover { transform: none; }
  }
</style>
</head>
<body>
  <main class="calc" aria-label="Scientific calculator">
    <div class="header">
      <div class="title">Scientific Calculator</div>
      <div class="deg-chip" title="Trigonometry uses degrees">DEG</div>
    </div>

    <section class="display" aria-live="polite">
      <div class="prev" id="prev"></div>
      <div class="main" id="main">0</div>
    </section>

    <div class="keys" id="keys">
      <!-- Scientific block -->
      <button class="fn" data-a="fn" data-v="sin(" aria-label="Sine">sin</button>
      <button class="fn" data-a="fn" data-v="cos(" aria-label="Cosine">cos</button>
      <button class="fn" data-a="fn" data-v="tan(" aria-label="Tangent">tan</button>
      <button class="fn" data-a="pi" aria-label="Pi">π</button>

      <button class="fn" data-a="sq" aria-label="Square">x²</button>
      <button class="fn" data-a="pow" aria-label="Power">xʸ</button>
      <button class="fn" data-a="fn" data-v="√(" aria-label="Square root">√</button>
      <button class="fn" data-a="inv" aria-label="Reciprocal">1/x</button>

      <button class="fn" data-a="open" aria-label="Open bracket">(</button>
      <button class="fn" data-a="close" aria-label="Close bracket">)</button>
      <button class="fn" data-a="pct" aria-label="Percent">%</button>
      <button class="fn" data-a="frac" aria-label="Show as fraction">a/b</button>

      <!-- Clear row -->
      <button class="clr span2" data-a="ac" aria-label="All clear">AC</button>
      <button class="clr span2" data-a="del" aria-label="Backspace">⌫</button>

      <!-- Number pad -->
      <button class="num" data-a="in" data-v="7">7</button>
      <button class="num" data-a="in" data-v="8">8</button>
      <button class="num" data-a="in" data-v="9">9</button>
      <button class="op" data-a="op" data-v="÷" aria-label="Divide">÷</button>

      <button class="num" data-a="in" data-v="4">4</button>
      <button class="num" data-a="in" data-v="5">5</button>
      <button class="num" data-a="in" data-v="6">6</button>
      <button class="op" data-a="op" data-v="×" aria-label="Multiply">×</button>

      <button class="num" data-a="in" data-v="1">1</button>
      <button class="num" data-a="in" data-v="2">2</button>
      <button class="num" data-a="in" data-v="3">3</button>
      <button class="op" data-a="op" data-v="−" aria-label="Subtract">−</button>

      <button class="num" data-a="in" data-v="0">0</button>
      <button class="num" data-a="in" data-v=".">.</button>
      <button class="eq" data-a="eq" aria-label="Equals">=</button>
      <button class="op" data-a="op" data-v="+" aria-label="Add">+</button>
    </div>

    <div class="legend">
      <span style="--c:#6366f1">Operators</span>
      <span style="--c:#14b8a6">Science</span>
      <span style="--c:#f43f5e">Clear</span>
    </div>
  </main>

<script>
(() => {
  'use strict';

  const mainEl = document.getElementById('main');
  const prevEl = document.getElementById('prev');

  let expr = '';        // what the student has typed (or the last result)
  let prev = '';        // small line above the main display
  let ans = null;       // last numeric answer
  let done = false;     // true right after "=" (or 1/x)
  let err = false;      // true while "Error" is showing
  let fracHTML = '';    // set while a fraction is being displayed

  /* ---------------- Number helpers ---------------- */

  // Cleans up floating-point noise (0.1 + 0.2 -> 0.3) and formats nicely.
  function fmt(x) {
    if (!Number.isFinite(x)) throw new Error('range');
    let r = parseFloat(x.toPrecision(12));
    if (r === 0) return '0';
    const a = Math.abs(r);
    if (a >= 1e15 || a < 1e-9) return r.toExponential().replace('e+', 'e');
    return String(r);
  }

  // Trigonometry in DEGREES, with exact values at multiples of 90°.
  function quadrant(d) {
    let n = d % 360;
    if (n < 0) n += 360;
    const q = n / 90;
    return Math.abs(q - Math.round(q)) < 1e-12 ? Math.round(q) % 4 : null;
  }
  const rad = d => d * Math.PI / 180;
  const sinDeg = d => { const k = quadrant(d); return k !== null ? [0, 1, 0, -1][k] : Math.sin(rad(d)); };
  const cosDeg = d => { const k = quadrant(d); return k !== null ? [1, 0, -1, 0][k] : Math.cos(rad(d)); };
  const tanDeg = d => {
    const k = quadrant(d);
    if (k !== null) {
      if (k % 2 === 1) throw new Error('tan undefined');
      return 0;
    }
    return Math.tan(rad(d));
  };

  // Continued fractions: turn a decimal into the simplest nearby fraction.
  function toFraction(x) {
    const neg = x < 0;
    const target = Math.abs(x);
    if (Number.isInteger(target)) return { n: target, d: 1, neg };
    let h0 = 0, h1 = 1, k0 = 1, k1 = 0, b = target;
    for (let i = 0; i < 40; i++) {
      const a = Math.floor(b);
      const h = a * h1 + h0;
      const k = a * k1 + k0;
      if (k > 10000) break;
      h0 = h1; h1 = h; k0 = k1; k1 = k;
      if (Math.abs(target - h1 / k1) < 1e-9 * Math.max(1, target)) break;
      const rest = b - a;
      if (rest < 1e-12) break;
      b = 1 / rest;
    }
    if (k1 === 0 || Math.abs(target - h1 / k1) > 1e-7 * Math.max(1, target)) return null;
    return { n: h1, d: k1, neg };
  }

  /* ---------------- Safe expression parser (no eval) ---------------- */

  function tokenize(s) {
    const t = [];
    const numRe = /(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/y;
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/[\d.]/.test(c)) {
        numRe.lastIndex = i;
        const m = numRe.exec(s);
        if (!m) throw new Error('bad number');
        i += m[0].length;
        if (s[i] === '.') throw new Error('bad number');
        t.push({ t: 'num', v: parseFloat(m[0]) });
        continue;
      }
      if (c === 'π') { t.push({ t: 'num', v: Math.PI }); i++; continue; }
      if ('+−×÷^'.includes(c)) { t.push({ t: 'op', v: c }); i++; continue; }
      if (c === '%') { t.push({ t: 'pct' }); i++; continue; }
      if (c === '(' || c === ')') { t.push({ t: c }); i++; continue; }
      const f = ['sin', 'cos', 'tan'].find(n => s.startsWith(n + '(', i));
      if (f) { t.push({ t: 'fn', v: f }); i += f.length; continue; }
      if (c === '√') { t.push({ t: 'fn', v: 'sqrt' }); i++; continue; }
      throw new Error('bad character');
    }
    return t;
  }

  function evaluate(src) {
    const tk = tokenize(src);

    // Brackets must be balanced
    let depth = 0;
    for (const k of tk) {
      if (k.t === '(') depth++;
      if (k.t === ')') depth--;
      if (depth < 0) throw new Error('brackets');
    }
    if (depth !== 0) throw new Error('brackets');

    let p = 0;
    const peek = () => tk[p];
    const next = () => tk[p++];
    const expect = type => {
      const k = next();
      if (!k || k.t !== type) throw new Error('syntax');
    };

    function parseExpr() {
      let v = parseTerm();
      while (peek() && peek().t === 'op' && (peek().v === '+' || peek().v === '−')) {
        const o = next().v;
        const start = p;
        let r = parseTerm();
        // "200 + 10%" means 200 + 10% of 200
        if (p - start === 2 && tk[start].t === 'num' && tk[start + 1].t === 'pct') {
          r = v * tk[start].v / 100;
        }
        v = o === '+' ? v + r : v - r;
      }
      return v;
    }

    function parseTerm() {
      let v = parseUnary();
      for (;;) {
        const k = peek();
        if (!k) break;
        if (k.t === 'op' && (k.v === '×' || k.v === '÷')) {
          next();
          const r = parseUnary();
          if (k.v === '÷') {
            if (r === 0) throw new Error('divide by zero');
            v /= r;
          } else {
            v *= r;
          }
        } else if (k.t === 'num' || k.t === 'fn' || k.t === '(') {
          v *= parseUnary(); // implicit multiplication: 2π, 3(4+1)
        } else break;
      }
      return v;
    }

    function parseUnary() {
      const k = peek();
      if (k && k.t === 'op' && k.v === '−') { next(); return -parseUnary(); }
      if (k && k.t === 'op' && k.v === '+') { next(); return parseUnary(); }
      return parsePower();
    }

    function parsePower() {
      const base = parsePostfix();
      const k = peek();
      if (k && k.t === 'op' && k.v === '^') {
        next();
        const exp = parseUnary(); // right-associative
        const r = Math.pow(base, exp);
        if (!Number.isFinite(r)) throw new Error('math error');
        return r;
      }
      return base;
    }

    function parsePostfix() {
      let v = parsePrimary();
      while (peek() && peek().t === 'pct') { next(); v /= 100; }
      return v;
    }

    function parsePrimary() {
      const k = next();
      if (!k) throw new Error('syntax');
      if (k.t === 'num') return k.v;
      if (k.t === '(') {
        const v = parseExpr();
        expect(')');
        return v;
      }
      if (k.t === 'fn') {
        expect('(');
        const v = parseExpr();
        expect(')');
        switch (k.v) {
          case 'sin': return sinDeg(v);
          case 'cos': return cosDeg(v);
          case 'tan': return tanDeg(v);
          case 'sqrt':
            if (v < 0) throw new Error('sqrt of negative');
            return Math.sqrt(v);
        }
      }
      throw new Error('syntax');
    }

    if (tk.length === 0) throw new Error('empty');
    const result = parseExpr();
    if (p !== tk.length) throw new Error('syntax');
    if (!Number.isFinite(result)) throw new Error('range');
    return result;
  }

  /* ---------------- State + UI ---------------- */

  function reset() {
    expr = ''; prev = ''; ans = null; done = false; err = false; fracHTML = '';
  }

  function setError() {
    err = true;
    prev = expr;
    expr = '';
    done = false;
    fracHTML = '';
  }

  // Called before adding input. isOp = the key continues from the last answer.
  function start(isOp) {
    fracHTML = '';
    if (done) {
      if (!isOp) expr = '';
      prev = '';
      done = false;
    }
  }

  const VALUE_END = /[\d.π)%]$/;

  function handle(a, v) {
    if (err) {
      reset();
      if (a === 'ac') return render();
    }

    switch (a) {
      case 'in': {
        start(false);
        if (v === '.') {
          const seg = expr.match(/[\d.]*$/)[0];
          if (seg.includes('.')) break;
          if (!/\d$/.test(expr)) expr += '0';
          expr += '.';
        } else {
          expr += v;
        }
        break;
      }
      case 'op': {
        start(true);
        if (!expr) { if (v === '−') expr = '−'; break; }
        if (expr === '−') break;
        const last = expr.slice(-1);
        if ('+−×÷^'.includes(last)) {
          if (v === '−' && '×÷^'.includes(last)) expr += '−';
          else expr = expr.replace(/[+−×÷^]+$/, '') + v;
        } else if (last === '(') {
          if (v === '−') expr += '−';
        } else {
          expr += v;
        }
        break;
      }
      case 'pct':
        start(true);
        if (VALUE_END.test(expr)) expr += '%';
        break;
      case 'sq':
        start(true);
        if (VALUE_END.test(expr)) expr += '^2';
        break;
      case 'pow':
        start(true);
        if (VALUE_END.test(expr)) expr += '^';
        break;
      case 'pi':
        start(false);
        expr += 'π';
        break;
      case 'fn':
        start(false);
        expr += v;
        break;
      case 'open':
        start(false);
        expr += '(';
        break;
      case 'close': {
        start(true);
        const opens = (expr.match(/\(/g) || []).length;
        const closes = (expr.match(/\)/g) || []).length;
        if (closes < opens && VALUE_END.test(expr)) expr += ')';
        break;
      }
      case 'del':
        fracHTML = ''; prev = ''; done = false;
        expr = expr.replace(/(sin\(|cos\(|tan\(|√\(|.)$/u, '');
        break;
      case 'ac':
        reset();
        break;
      case 'eq': {
        if (!expr || done) break;
        try {
          const val = evaluate(expr);
          const text = fmt(val);
          prev = expr + ' =';
          expr = text;
          ans = parseFloat(text);
          done = true;
          fracHTML = '';
        } catch (e) { setError(); }
        break;
      }
      case 'inv': {
        if (!expr) break;
        try {
          const val = evaluate(expr);
          if (val === 0) throw new Error('divide by zero');
          const res = 1 / val;
          prev = '1 ÷ (' + expr + ') =';
          expr = fmt(res);
          ans = parseFloat(expr);
          done = true;
          fracHTML = '';
        } catch (e) { setError(); }
        break;
      }
      case 'frac': {
        if (fracHTML) { fracHTML = ''; break; }
        let val;
        if (done) {
          val = ans;
        } else {
          if (!expr) break;
          try {
            val = evaluate(expr);
            const text = fmt(val);
            prev = expr + ' =';
            expr = text;
            val = parseFloat(text);
            ans = val;
            done = true;
          } catch (e) { setError(); break; }
        }
        const f = toFraction(val);
        if (!f) { prev = 'No simple fraction'; break; }
        if (f.d === 1) { prev = 'Already a whole number'; break; }
        fracHTML = (f.neg ? '−' : '') +
          '<span class="frac"><span class="n">' + f.n + '</span><span class="d">' + f.d + '</span></span>';
        break;
      }
    }
    render();
  }

  function render() {
    const text = err ? 'Error' : (expr || '0');
    if (fracHTML && !err) mainEl.innerHTML = fracHTML;
    else mainEl.textContent = text;

    mainEl.classList.toggle('error', err);
    const len = text.length;
    mainEl.classList.toggle('s1', len > 11 && len <= 16);
    mainEl.classList.toggle('s2', len > 16);

    // Small line: previous expression, or a live preview while typing
    let top = prev;
    if (!top && !done && !err && expr && !fracHTML) {
      try {
        const f = fmt(evaluate(expr));
        if (f !== expr) top = '= ' + f;
      } catch (e) { /* incomplete expression: show nothing */ }
    }
    prevEl.textContent = top;
  }

  /* ---------------- Events ---------------- */

  document.getElementById('keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    handle(b.dataset.a, b.dataset.v);
  });

  const KEYMAP = {
    '0': ['in', '0'], '1': ['in', '1'], '2': ['in', '2'], '3': ['in', '3'], '4': ['in', '4'],
    '5': ['in', '5'], '6': ['in', '6'], '7': ['in', '7'], '8': ['in', '8'], '9': ['in', '9'],
    '.': ['in', '.'], ',': ['in', '.'],
    '+': ['op', '+'], '-': ['op', '−'], '*': ['op', '×'], 'x': ['op', '×'], '/': ['op', '÷'],
    '^': ['pow'], '%': ['pct'], '(': ['open'], ')': ['close'], 'p': ['pi'],
    'Enter': ['eq'], '=': ['eq'], 'Backspace': ['del'], 'Escape': ['ac'], 'Delete': ['ac']
  };

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const m = KEYMAP[e.key];
    if (!m) return;
    e.preventDefault();
    const [a, v] = m;
    handle(a, v);
    const sel = v !== undefined ? `[data-a="${a}"][data-v="${v}"]` : `[data-a="${a}"]`;
    const btn = document.querySelector(sel);
    if (btn) {
      btn.classList.add('pressed');
      setTimeout(() => btn.classList.remove('pressed'), 110);
    }
  });

  render();
})();
</script>
</body>
</html>

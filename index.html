<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070816">
<title>Scientific Calculator</title>
<script>
  try {
    var t = localStorage.getItem('sc-theme');
    t = t ? JSON.parse(t) : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #070816;
    --text: #f2f3ff;
    --muted: #8e94c4;
    --glass: rgba(255,255,255,.055);
    --glass-b: rgba(255,255,255,.11);
    --shadow: 0 30px 80px -30px rgba(0,0,0,.85);
    --blob1: #6d28d9; --blob2: #0ea5e9; --blob3: #ec4899; --blob-o: .4;

    --num-bg: rgba(255,255,255,.075); --num-br: rgba(255,255,255,.10);
    --op-bg: rgba(139,92,246,.20);   --op-t: #d8ccff; --op-br: rgba(167,139,250,.38);
    --fn-bg: rgba(45,212,191,.11);   --fn-t: #6ee7d6; --fn-br: rgba(45,212,191,.26);
    --clr-bg: rgba(251,113,133,.16); --clr-t: #ffb4c0; --clr-br: rgba(251,113,133,.34);
    --mem-bg: rgba(251,191,36,.11);  --mem-t: #fcd34d; --mem-br: rgba(251,191,36,.28);

    --c-num: #f4f5ff; --c-op: #a78bfa; --c-fn: #5eead4; --c-const: #fbbf24; --c-par: #8e94c4;

    --r: clamp(16px, 2.4vmin, 28px);
    --kr: clamp(10px, 1.8vmin, 18px);
    --gap: clamp(5px, 1vmin, 12px);
    --pad: clamp(8px, 1.8vmin, 22px);
    --main-fs: clamp(2.6rem, calc(1.4vw + 2.4vh), 4.6rem);
  }

  [data-theme="light"] {
    color-scheme: light;
    --bg: #eef0ff;
    --text: #1c1f3d;
    --muted: #6b7099;
    --glass: rgba(255,255,255,.6);
    --glass-b: rgba(255,255,255,.95);
    --shadow: 0 25px 60px -25px rgba(70,60,160,.4);
    --blob1: #a78bfa; --blob2: #7dd3fc; --blob3: #f9a8d4; --blob-o: .65;

    --num-bg: rgba(255,255,255,.95); --num-br: rgba(110,110,180,.18);
    --op-bg: rgba(124,58,237,.12);   --op-t: #5b21b6; --op-br: rgba(124,58,237,.3);
    --fn-bg: rgba(13,148,136,.10);   --fn-t: #0f766e; --fn-br: rgba(13,148,136,.3);
    --clr-bg: rgba(225,29,72,.10);   --clr-t: #be123c; --clr-br: rgba(225,29,72,.28);
    --mem-bg: rgba(217,119,6,.12);   --mem-t: #b45309; --mem-br: rgba(217,119,6,.3);

    --c-num: #1c1f3d; --c-op: #7c3aed; --c-fn: #0d9488; --c-const: #d97706; --c-par: #8a8fb5;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior: none;
  }

  /* ---------- Animated aurora background ---------- */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .blob { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(90px); opacity: var(--blob-o); }
  .b1 { background: var(--blob1); top: -20vmax; left: -15vmax; animation: drift1 22s ease-in-out infinite alternate; }
  .b2 { background: var(--blob2); bottom: -25vmax; right: -15vmax; animation: drift2 26s ease-in-out infinite alternate; }
  .b3 { background: var(--blob3); top: 30%; left: 45%; width: 35vmax; height: 35vmax; opacity: calc(var(--blob-o) * .7); animation: drift3 30s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(14vmax, 10vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-12vmax, -8vmax) scale(1.2); } }
  @keyframes drift3 { to { transform: translate(-18vmax, 12vmax) scale(.85); } }

  /* ---------- App layout (fills the whole screen) ---------- */
  .app {
    position: relative; z-index: 1;
    width: 100%; height: 100vh; height: 100dvh;
    padding: var(--pad);
    padding-left: max(var(--pad), env(safe-area-inset-left));
    padding-right: max(var(--pad), env(safe-area-inset-right));
    padding-bottom: max(var(--pad), env(safe-area-inset-bottom));
    display: grid; gap: var(--pad);
    grid-template-columns: minmax(320px, 36%) 1fr;
    grid-template-rows: auto auto 1fr;
    grid-template-areas: "top top" "disp keys" "hist keys";
  }
  .app > * { min-width: 0; min-height: 0; }

  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-b);
    border-radius: var(--r);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    box-shadow: var(--shadow);
  }

  /* ---------- Top bar ---------- */
  .top { grid-area: top; display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    font-weight: 800; font-size: 1.15rem; color: #fff;
    background: linear-gradient(135deg, #6366f1, #a855f7 55%, #ec4899);
    box-shadow: 0 8px 24px -8px rgba(168,85,247,.8);
  }
  .brand h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; line-height: 1.1; }
  .brand small { color: var(--muted); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
  .tools { display: flex; gap: 8px; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
    background: var(--glass); border: 1px solid var(--glass-b); color: var(--text); cursor: pointer;
    transition: transform .14s cubic-bezier(.34,1.56,.64,1), background .15s;
  }
  .icon-btn:hover { background: var(--glass-b); transform: translateY(-1px); }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hist-btn { display: none; }

  /* ---------- Display ---------- */
  .display {
    grid-area: disp; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: clamp(12px, 2.2vmin, 26px);
    min-height: clamp(150px, 24vh, 300px);
  }
  .display::before {
    content: ""; position: absolute; right: -25%; top: -45%; width: 80%; height: 130%;
    background: radial-gradient(closest-side, rgba(139,92,246,.30), transparent);
    pointer-events: none;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 26px; position: relative; }
  .chip {
    font-size: .68rem; font-weight: 700; letter-spacing: .1em; padding: 4px 11px; border-radius: 999px;
    background: var(--fn-bg); color: var(--fn-t); border: 1px solid var(--fn-br);
  }
  .chip.mem { background: var(--mem-bg); color: var(--mem-t); border-color: var(--mem-br); }
  .chip.sec { background: var(--op-bg); color: var(--op-t); border-color: var(--op-br); }
  .chip[hidden] { display: none; }

  .readout { position: relative; display: flex; flex-direction: column; align-items: flex-end; min-width: 0; }
  .prev {
    font-size: clamp(.82rem, calc(.6rem + .9vmin), 1.15rem); color: var(--muted);
    min-height: 1.6em; max-width: 100%; overflow-x: auto; white-space: nowrap; scrollbar-width: none;
  }
  .prev::-webkit-scrollbar, .main::-webkit-scrollbar { display: none; }
  .main {
    width: 100%; text-align: right; font-size: var(--main-fs); font-weight: 300; line-height: 1.18;
    letter-spacing: -.02em; white-space: nowrap; overflow-x: auto; scrollbar-width: none;
    font-variant-numeric: tabular-nums;
  }
  .t-num { color: var(--c-num); }
  .t-op { color: var(--c-op); margin: 0 .08em; font-weight: 400; }
  .t-fn { color: var(--c-fn); }
  .t-const { color: var(--c-const); }
  .t-par { color: var(--c-par); }
  .t-err { color: #fb7185; font-weight: 500; }
  .caret {
    display: inline-block; width: 3px; height: .85em; margin-left: 3px; vertical-align: -.05em;
    background: linear-gradient(#a855f7, #6366f1); border-radius: 2px; animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; font-size: .8em; margin-left: .15em; }
  .frac .n { padding: 0 .25em .06em; border-bottom: .07em solid currentColor; }
  .frac .d { padding: .06em .25em 0; }

  /* ---------- History ---------- */
  .history { grid-area: hist; display: flex; flex-direction: column; padding: clamp(10px, 1.6vmin, 18px); }
  .h-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .h-head h2 { margin: 0; font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .link-btn {
    background: none; border: 0; color: var(--op-t); font: inherit; font-size: .8rem; font-weight: 600; cursor: pointer;
    padding: 4px 8px; border-radius: 8px;
  }
  .link-btn:hover { background: var(--op-bg); }
  .h-close { display: none; }
  .h-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; }
  .h-empty { color: var(--muted); font-size: .85rem; text-align: center; margin: auto; padding: 20px; }
  .h-item {
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px; width: 100%;
    background: var(--num-bg); border: 1px solid var(--num-br); border-radius: 12px; padding: 8px 12px;
    color: var(--text); font: inherit; cursor: pointer; text-align: right;
    transition: transform .12s ease, background .15s;
  }
  .h-item:hover { background: var(--op-bg); transform: translateX(-2px); }
  .h-item:active { transform: scale(.98); }
  .h-e { font-size: .8rem; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-r { font-size: 1.2rem; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Keypad ---------- */
  .keypad {
    grid-area: keys; display: grid; grid-template-columns: 5fr 4fr; gap: calc(var(--gap) * 2.2);
    padding: calc(var(--gap) * 1.6);
  }
  .grid { display: grid; gap: var(--gap); grid-template-rows: repeat(5, minmax(0, 1fr)); min-height: 0; }
  .sci { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .mainpad { grid-template-columns: repeat(4, minmax(0, 1fr)); }

  .key {
    --kb: var(--num-bg); --kt: var(--text); --kbr: var(--num-br);
    position: relative; overflow: hidden; width: 100%; height: 100%; min-height: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--kbr); border-radius: var(--kr);
    background: var(--kb); color: var(--kt);
    font: inherit; font-weight: 600; font-size: var(--kfs); cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 10px 18px -12px rgba(0,0,0,.6);
    transition: transform .16s cubic-bezier(.34,1.56,.64,1), filter .15s, box-shadow .2s, background .2s;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .key::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.12), transparent 55%); }
  .key:hover { filter: brightness(1.2); transform: translateY(-1px); }
  .key:active, .key.pressed { transform: scale(.92); filter: brightness(1.35); }
  .key:focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }

  .sci .key { --kfs: clamp(.8rem, calc(.55rem + 1.1vmin + .5vw), 1.45rem); }
  .mainpad .key { --kfs: clamp(1.1rem, calc(.7rem + 2.1vmin + .5vw), 2.2rem); }

  .k-op  { --kb: var(--op-bg);  --kt: var(--op-t);  --kbr: var(--op-br); }
  .k-fn  { --kb: var(--fn-bg);  --kt: var(--fn-t);  --kbr: var(--fn-br); }
  .k-clr { --kb: var(--clr-bg); --kt: var(--clr-t); --kbr: var(--clr-br); }
  .k-mem { --kb: var(--mem-bg); --kt: var(--mem-t); --kbr: var(--mem-br); }
  .k-tog { --kb: var(--op-bg);  --kt: var(--op-t);  --kbr: var(--op-br); }
  .k-op { font-size: calc(var(--kfs) * 1.2); font-weight: 500; }
  .k-tog.on { background: linear-gradient(135deg, #2dd4bf, #38bdf8); color: #032a2a; border-color: transparent; box-shadow: 0 8px 22px -8px rgba(45,212,191,.8); }
  .k-eq {
    background: linear-gradient(135deg, #6366f1, #a855f7 55%, #ec4899); color: #fff; border-color: transparent;
    font-size: calc(var(--kfs) * 1.25);
    box-shadow: 0 12px 30px -10px rgba(168,85,247,.85), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .k-eq:hover { filter: brightness(1.12); box-shadow: 0 14px 38px -8px rgba(168,85,247,1), inset 0 1px 0 rgba(255,255,255,.3); }

  .has-alt .l2 { display: none; }
  .second .has-alt .l1 { display: none; }
  .second .has-alt .l2 { display: inline; }
  .second .has-alt { --kb: var(--op-bg); --kt: var(--op-t); --kbr: var(--op-br); }

  .ripple {
    position: absolute; border-radius: 50%; background: rgba(255,255,255,.4); pointer-events: none;
    transform: scale(0); animation: rip .55s ease-out forwards;
  }
  @keyframes rip { to { transform: scale(2.6); opacity: 0; } }

  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 60;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    padding: 10px 18px; border-radius: 999px; font-size: .85rem; font-weight: 600;
    background: rgba(20,22,48,.92); color: #fff; border: 1px solid rgba(255,255,255,.15);
    transition: opacity .2s, transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .scrim { display: none; }

  /* ---------- Phone portrait ---------- */
  @media (max-width: 899px) and (orientation: portrait) {
    :root { --main-fs: clamp(2.4rem, 12vw, 4rem); --pad: clamp(8px, 2.4vw, 14px); }
    .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(120px, 24dvh) 1fr; grid-template-areas: "top" "disp" "keys"; gap: 8px; }
    .display { min-height: 0; }
    .keypad { grid-template-columns: 1fr; grid-template-rows: 5fr 5.6fr; gap: calc(var(--gap) * 1.6); padding: var(--gap); }
    .sci .key { --kfs: clamp(.8rem, 3.6vw, 1.15rem); }
    .mainpad .key { --kfs: clamp(1.2rem, 6vw, 1.8rem); }
  }

  /* ---------- Phone landscape / small tablets ---------- */
  @media (max-width: 899px) and (orientation: landscape) {
    :root { --main-fs: clamp(1.8rem, 9vh, 3rem); --pad: clamp(6px, 1.6vh, 12px); }
    .app { grid-template-columns: minmax(180px, 32%) 1fr; grid-template-rows: auto 1fr; grid-template-areas: "top top" "disp keys"; gap: 8px; }
    .display { min-height: 0; }
    .brand small { display: none; }
    .logo { width: 30px; height: 30px; font-size: .95rem; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; }
    .sci .key { --kfs: clamp(.7rem, 3.4vh, 1.1rem); }
    .mainpad .key { --kfs: clamp(1rem, 5.4vh, 1.6rem); }
    .keypad { gap: var(--gap); padding: calc(var(--gap) * .8); }
  }

  /* ---------- History as a slide-up drawer on small screens ---------- */
  @media (max-width: 899px) {
    .hist-btn { display: grid; }
    .history {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-height: 72dvh; min-height: 40dvh;
      border-radius: var(--r) var(--r) 0 0; transform: translateY(105%); transition: transform .3s cubic-bezier(.3,.9,.3,1);
      background: var(--bg); padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
    .history.open { transform: none; }
    .h-close { display: inline-block; }
    .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .25s; }
    .scrim.show { opacity: 1; pointer-events: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob, .caret { animation: none; }
    .key, .icon-btn, .h-item { transition: none; }
    .ripple { display: none; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo">∑</div>
        <div><h1>Scientific Calculator</h1><small>Year 9 Maths &amp; Science</small></div>
      </div>
      <div class="tools">
        <button class="icon-btn hist-btn" id="btnHist" type="button" aria-label="Show history" title="History">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button class="icon-btn" id="btnCopy" type="button" aria-label="Copy result" title="Copy result">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        </button>
        <button class="icon-btn" id="btnTheme" type="button" aria-label="Switch light or dark theme" title="Theme">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <section class="display glass" aria-live="polite" aria-label="Display">
      <div class="chips">
        <span class="chip" id="chipAngle">DEG</span>
        <span class="chip sec" id="chip2nd" hidden>2nd</span>
        <span class="chip mem" id="chipMem" hidden>M</span>
      </div>
      <div class="readout">
        <div class="prev" id="prev"></div>
        <div class="main" id="main"></div>
      </div>
    </section>

    <aside class="history glass" id="history" aria-label="History">
      <div class="h-head">
        <h2>History</h2>
        <div>
          <button class="link-btn" id="btnClearHist" type="button">Clear</button>
          <button class="link-btn h-close" id="btnCloseHist" type="button">Close</button>
        </div>
      </div>
      <div class="h-list" id="hList"></div>
    </aside>

    <section class="keypad glass" id="pad" aria-label="Calculator keys">
      <div class="grid sci" id="sci"></div>
      <div class="grid mainpad" id="mainpad"></div>
    </section>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const mainEl = $('#main'), prevEl = $('#prev'), pad = $('#pad');
  const chipAngle = $('#chipAngle'), chip2nd = $('#chip2nd'), chipMem = $('#chipMem');
  const hList = $('#hList'), historyEl = $('#history'), scrim = $('#scrim'), toastEl = $('#toast');

  /* ================= Storage (safe) ================= */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ================= State ================= */
  let expr = '', prev = '', ans = null;
  let done = false, err = false, errMsg = '', fracHTML = '';
  let mode = 'DEG', second = false;
  let memory = store.get('sc-mem', 0);
  let history = store.get('sc-history', []);

  /* ================= Number helpers ================= */
  const round = x => parseFloat(x.toPrecision(12));       // removes floating-point noise
  function fmt(x) {
    if (!Number.isFinite(x)) throw new Error('range');
    const r = round(x);
    if (r === 0) return '0';
    const a = Math.abs(r);
    let s = (a >= 1e15 || a < 1e-9) ? r.toExponential() : String(r);
    s = s.replace('e+', 'e');
    return s[0] === '-' ? '−' + s.slice(1) : s;           // use the same minus the keypad uses
  }
  const toNum = s => parseFloat(String(s).replace('−', '-'));

  /* ================= Trigonometry (DEG or RAD) ================= */
  const D2R = Math.PI / 180;
  function quadrant(d) {                                   // exact values at multiples of 90°
    let n = d % 360; if (n < 0) n += 360;
    const q = n / 90;
    return Math.abs(q - Math.round(q)) < 1e-12 ? Math.round(q) % 4 : null;
  }
  const toDeg = v => mode === 'DEG' ? v : v * 180 / Math.PI;
  const toRad = v => mode === 'DEG' ? v * D2R : v;
  const fromRad = r => mode === 'DEG' ? r / D2R : r;
  const sinA = v => { const k = quadrant(toDeg(v)); return k !== null ? [0, 1, 0, -1][k] : Math.sin(toRad(v)); };
  const cosA = v => { const k = quadrant(toDeg(v)); return k !== null ? [1, 0, -1, 0][k] : Math.cos(toRad(v)); };
  const tanA = v => {
    const k = quadrant(toDeg(v));
    if (k !== null) { if (k % 2 === 1) throw new Error('tan undefined'); return 0; }
    return Math.tan(toRad(v));
  };

  function factorial(n) {
    if (Math.abs(n - Math.round(n)) > 1e-9) throw new Error('factorial');
    n = Math.round(n);
    if (n < 0 || n > 170) throw new Error('factorial');
    let r = 1; for (let i = 2; i <= n; i++) r *= i;
    return r;
  }
  function nthRoot(n, x) {
    if (n === 0) throw new Error('domain');
    if (x < 0) {
      if (Number.isInteger(n) && Math.abs(n) % 2 === 1) return -Math.pow(-x, 1 / n);
      throw new Error('sqrt of negative');
    }
    return Math.pow(x, 1 / n);
  }

  function toFraction(x) {                                 // continued fractions
    const neg = x < 0, target = Math.abs(x);
    if (Number.isInteger(target)) return { n: target, d: 1, neg };
    let h0 = 0, h1 = 1, k0 = 1, k1 = 0, b = target;
    for (let i = 0; i < 40; i++) {
      const a = Math.floor(b);
      const h = a * h1 + h0, k = a * k1 + k0;
      if (k > 10000) break;
      h0 = h1; h1 = h; k0 = k1; k1 = k;
      if (Math.abs(target - h1 / k1) < 1e-9 * Math.max(1, target)) break;
      const rest = b - a;
      if (rest < 1e-12) break;
      b = 1 / rest;
    }
    if (k1 === 0 || Math.abs(target - h1 / k1) > 1e-7 * Math.max(1, target)) return null;
    return { n: h1, d: k1, neg };
  }

  /* ================= Safe parser (no eval) ================= */
  const FN_TOKENS = [
    ['sin⁻¹', 'asin'], ['cos⁻¹', 'acos'], ['tan⁻¹', 'atan'],
    ['sin', 'sin'], ['cos', 'cos'], ['tan', 'tan'],
    ['ln', 'ln'], ['log', 'log'], ['abs', 'abs']
  ];

  function tokenize(s) {
    const t = [];
    const numRe = /(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/y;
    const valueBefore = () => { const k = t[t.length - 1]; return !!k && (k.t === 'num' || k.t === ')' || k.t === 'pct' || k.t === 'fact'); };
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/[\d.]/.test(c)) {
        numRe.lastIndex = i;
        const m = numRe.exec(s);
        if (!m) throw new Error('syntax');
        i += m[0].length;
        if (s[i] === '.') throw new Error('syntax');
        t.push({ t: 'num', v: parseFloat(m[0]) });
        continue;
      }
      if (c === 'π') { t.push({ t: 'num', v: Math.PI }); i++; continue; }
      if (c === 'ℯ') { t.push({ t: 'num', v: Math.E }); i++; continue; }
      if (s.startsWith('Ans', i)) { t.push({ t: 'num', v: ans === null ? 0 : ans }); i += 3; continue; }
      if (s.startsWith('mod', i)) { t.push({ t: 'op', v: 'mod' }); i += 3; continue; }
      if ('+−×÷^'.includes(c)) { t.push({ t: 'op', v: c }); i++; continue; }
      if (c === '%') { t.push({ t: 'pct' }); i++; continue; }
      if (c === '!') { t.push({ t: 'fact' }); i++; continue; }
      if (c === '(' || c === ')') { t.push({ t: c }); i++; continue; }
      const f = FN_TOKENS.find(([n]) => s.startsWith(n + '(', i));
      if (f) { t.push({ t: 'fn', v: f[1] }); i += f[0].length; continue; }
      if (c === '∛') { t.push({ t: 'fn', v: 'cbrt' }); i++; continue; }
      if (c === '√') { t.push(valueBefore() ? { t: 'op', v: 'root' } : { t: 'fn', v: 'sqrt' }); i++; continue; }
      throw new Error('syntax');
    }
    return t;
  }

  function evaluate(src) {
    const tk = tokenize(src);
    let depth = 0;
    for (const k of tk) {
      if (k.t === '(') depth++;
      if (k.t === ')') depth--;
      if (depth < 0) throw new Error('brackets');
    }
    if (depth !== 0) throw new Error('brackets');

    let p = 0;
    const peek = () => tk[p];
    const next = () => tk[p++];
    const expect = type => { const k = next(); if (!k || k.t !== type) throw new Error('syntax'); };

    function parseExpr() {
      let v = parseTerm();
      while (peek() && peek().t === 'op' && (peek().v === '+' || peek().v === '−')) {
        const o = next().v, start = p;
        let r = parseTerm();
        if (p - start === 2 && tk[start].t === 'num' && tk[start + 1].t === 'pct') r = v * tk[start].v / 100; // 200 + 10% = 220
        v = o === '+' ? v + r : v - r;
      }
      return v;
    }
    function parseTerm() {
      let v = parseUnary();
      for (;;) {
        const k = peek();
        if (!k) break;
        if (k.t === 'op' && (k.v === '×' || k.v === '÷' || k.v === 'mod')) {
          next();
          const r = parseUnary();
          if (k.v === '×') v *= r;
          else {
            if (r === 0) throw new Error('divide by zero');
            v = k.v === '÷' ? v / r : v - r * Math.floor(v / r);
          }
        } else if (k.t === 'num' || k.t === 'fn' || k.t === '(') {
          v *= parseUnary();                               // implicit multiplication: 2π, 3(4+1)
        } else break;
      }
      return v;
    }
    function parseUnary() {
      const k = peek();
      if (k && k.t === 'op' && k.v === '−') { next(); return -parseUnary(); }
      if (k && k.t === 'op' && k.v === '+') { next(); return parseUnary(); }
      return parsePower();
    }
    function parsePower() {
      const base = parsePostfix();
      const k = peek();
      if (k && k.t === 'op' && k.v === '^') {
        next();
        const r = Math.pow(base, parseUnary());
        if (!Number.isFinite(r)) throw new Error('domain');
        return r;
      }
      if (k && k.t === 'op' && k.v === 'root') {           // 3√27 = cube root of 27
        next();
        return nthRoot(base, parseUnary());
      }
      return base;
    }
    function parsePostfix() {
      let v = parsePrimary();
      for (;;) {
        const k = peek();
        if (k && k.t === 'pct') { next(); v /= 100; }
        else if (k && k.t === 'fact') { next(); v = factorial(v); }
        else break;
      }
      return v;
    }
    function parsePrimary() {
      const k = next();
      if (!k) throw new Error('syntax');
      if (k.t === 'num') return k.v;
      if (k.t === '(') { const v = parseExpr(); expect(')'); return v; }
      if (k.t === 'fn') {
        expect('(');
        const v = parseExpr();
        expect(')');
        switch (k.v) {
          case 'sin': return sinA(v);
          case 'cos': return cosA(v);
          case 'tan': return tanA(v);
          case 'asin': if (Math.abs(v) > 1) throw new Error('domain'); return fromRad(Math.asin(v));
          case 'acos': if (Math.abs(v) > 1) throw new Error('domain'); return fromRad(Math.acos(v));
          case 'atan': return fromRad(Math.atan(v));
          case 'ln':   if (v <= 0) throw new Error('domain'); return Math.log(v);
          case 'log':  if (v <= 0) throw new Error('domain'); return Math.log10(v);
          case 'abs':  return Math.abs(v);
          case 'sqrt': if (v < 0) throw new Error('sqrt of negative'); return Math.sqrt(v);
          case 'cbrt': return Math.cbrt(v);
        }
      }
      throw new Error('syntax');
    }

    if (tk.length === 0) throw new Error('syntax');
    const result = parseExpr();
    if (p !== tk.length) throw new Error('syntax');
    if (!Number.isFinite(result)) throw new Error('domain');
    return result;
  }

  function reason(e) {
    switch (e && e.message) {
      case 'divide by zero': return "You can't divide by zero";
      case 'brackets': return "The brackets don't match";
      case 'sqrt of negative': return "Can't take an even root of a negative number";
      case 'tan undefined': return 'tan is undefined at this angle';
      case 'domain': return 'That number is outside what this function allows';
      case 'factorial': return 'Factorial needs a whole number from 0 to 170';
      default: return 'Check the expression and try again';
    }
  }

  /* ================= Key layout ================= */
  const SCI = [

  function buildKeys(list, parent) {

  buildKeys(SCI, $('#sci'));
  buildKeys(MAIN, $('#mainpad'));

  /* ================= Input logic ================= */
  const isValueEnd = s => /(\d|\.|π|ℯ|\)|%|!|Ans)$/.test(s);
  const TRAIL_OP = /(mod|[+−×÷^])+$/;

  function reset() { expr = ''; prev = ''; done = false; err = false; errMsg = ''; fracHTML = ''; }
  function setError(e) { err = true; errMsg = reason(e); expr = ''; prev = ''; done = false; fracHTML = ''; }
  function start(isOp) {
    fracHTML = '';
    if (done) { if (!isOp) expr = ''; prev = ''; done = false; }
  }
  function currentValue() {
    if (done && ans !== null) return ans;
    if (!expr) return null;
    return evaluate(expr);
  }
  function applyFn(v, autoMul) {
    if (done) { expr = v + expr + ')'; prev = ''; done = false; fracHTML = ''; return; }   // wrap the last answer
    start(false);
    if (autoMul && isValueEnd(expr)) expr += '×';
    expr += v;
  }

  function handle(a, v) {
    if (err) {
      const wasAC = a === 'ac';
      reset();
      if (wasAC) { render(); return; }
    }

    switch (a) {
      case 'in': {
        start(false);
        if (v === '.') {
          const seg = expr.match(/[\d.]*$/)[0];
          if (seg.includes('.')) break;
          if (!/\d$/.test(expr)) expr += '0';
          expr += '.';
        } else expr += v;
        break;
      }
      case 'op': {
        start(true);
        if (!expr) { if (v === '−') expr = '−'; break; }
        if (expr === '−') break;
        if (expr.endsWith('√') && !/\($/.test(expr)) { if (v === '−') expr += '−'; break; }
        const tail = expr.match(TRAIL_OP);
        if (tail) {
          const last = expr.slice(-1);
          if (v === '−' && '×÷^'.includes(last)) expr += '−';
          else expr = expr.replace(TRAIL_OP, '') + v;
        } else if (expr.endsWith('(')) {
          if (v === '−') expr += '−';
        } else expr += v;
        break;
      }
      case 'post':
        start(true);
        if (isValueEnd(expr)) expr += v;
        break;
      case 'const':
        start(false);
        expr += v;
        break;
      case 'fn':
        applyFn(v, /^\d/.test(v));
        break;
      case 'rootfn':
        applyFn(v, true);
        break;
      case 'open':
        start(false);
        expr += '(';
        break;
      case 'close': {
        start(true);
        const opens = (expr.match(/\(/g) || []).length;
        const closes = (expr.match(/\)/g) || []).length;
        if (closes < opens && isValueEnd(expr)) expr += ')';
        break;
      }
      case 'pm': {
        if (done) { ans = -ans; expr = fmt(ans); fracHTML = ''; break; }
        if (!expr) { expr = '−'; break; }
        const m = expr.match(/(\d[\d.]*(?:e[+-]?\d+)?|\.\d+|π|ℯ|Ans)$/);
        if (!m) break;
        const head = expr.slice(0, expr.length - m[0].length);
        if (/(^|[(×÷^]|mod)−$/.test(head)) expr = head.slice(0, -1) + m[0];
        else if (head.endsWith('−')) expr = head.slice(0, -1) + '+' + m[0];
        else if (head.endsWith('+')) expr = head.slice(0, -1) + '−' + m[0];
        else expr = head + '−' + m[0];
        break;
      }
      case 'del':
        fracHTML = ''; prev = ''; done = false;
        expr = expr.replace(/(sin⁻¹\(|cos⁻¹\(|tan⁻¹\(|sin\(|cos\(|tan\(|ln\(|log\(|abs\(|∛\(|√\(|mod|Ans|.)$/u, '');
        break;
      case 'ac':
        reset();
        break;
      case 'second':
        second = !second;
        break;
      case 'angle':
        mode = mode === 'DEG' ? 'RAD' : 'DEG';
        toast(mode === 'DEG' ? 'Angles in degrees' : 'Angles in radians');
        break;
      case 'eq': {
        if (!expr || done) break;
        try {
          const val = evaluate(expr);
          const text = fmt(val);
          pushHistory(expr, text);
          prev = expr + ' =';
          expr = text;
          ans = round(val);
          done = true;
          fracHTML = '';
        } catch (e) { setError(e); }
        break;
      }
      case 'inv': {
        if (!expr && !done) break;
        try {
          const val = currentValue();
          if (val === 0) throw new Error('divide by zero');
          const res = 1 / val;
          prev = '1 ÷ (' + (done ? fmt(ans) : expr) + ') =';
          expr = fmt(res); ans = round(res); done = true; fracHTML = '';
        } catch (e) { setError(e); }
        break;
      }
      case 'frac': {
        if (fracHTML) { fracHTML = ''; break; }
        if (!expr && !done) break;
        let val;
        try { val = currentValue(); } catch (e) { setError(e); break; }
        if (!done) { prev = expr + ' ='; expr = fmt(val); ans = round(val); done = true; }
        const f = toFraction(round(val));
        if (!f) { prev = 'No simple fraction for this number'; break; }
        if (f.d === 1) { prev = 'Already a whole number'; break; }
        fracHTML = (f.neg ? '−' : '') + '<span class="frac"><span class="n">' + f.n + '</span><span class="d">' + f.d + '</span></span>';
        prev = f.n > f.d
          ? '= ' + (f.neg ? '−' : '') + Math.floor(f.n / f.d) + ' ' + (f.n % f.d) + '/' + f.d + '  (mixed number)'
          : '= ' + expr;
        break;
      }
      case 'mp': case 'mm': {
        try {
          const val = currentValue();
          if (val === null) break;
          memory = round(memory + (a === 'mp' ? val : -val));
          store.set('sc-mem', memory);
          toast('Memory: ' + fmt(memory));
        } catch (e) { setError(e); }
        break;
      }
      case 'mc':
        memory = 0; store.set('sc-mem', 0); toast('Memory cleared');
        break;
      case 'mr': {
        start(false);
        if (isValueEnd(expr)) expr += '×';
        const t = fmt(memory);
        expr += memory < 0 ? '(' + t + ')' : t;
        break;
      }
      case 'rnd': {
        start(false);
        if (isValueEnd(expr)) expr += '×';
        expr += fmt(Math.random());
        break;
      }
    }
    render();
  }

  /* ================= Rendering ================= */
  function colorize(s) {
    return s.replace(
      /(sin⁻¹\(|cos⁻¹\(|tan⁻¹\(|sin\(|cos\(|tan\(|ln\(|log\(|abs\(|∛\(|√\(|√)|(\d+\.?\d*(?:e[+-]?\d+)?|\.\d+)|(\+|−|×|÷|\^|mod)|(π|ℯ|Ans)|([()])|(%|!)/g,
      (m, f, n, o, c, p, x) =>
        f ? '<span class="t-fn">' + m + '</span>' :
        n ? '<span class="t-num">' + m + '</span>' :
        o ? '<span class="t-op">' + m + '</span>' :
        c ? '<span class="t-const">' + m + '</span>' :
        p ? '<span class="t-par">' + m + '</span>' :
            '<span class="t-op">' + m + '</span>'
    );
  }

  function fit() {
    mainEl.style.fontSize = '';

    while (mainEl.scrollWidth > mainEl.clientWidth + 1 && size > 20) {
      size -= 2;
      mainEl.style.fontSize = size + 'px';
    }
    mainEl.scrollLeft = mainEl.scrollWidth;
  }

  function render() {
    if (err) mainEl.innerHTML = '<span class="t-err">Error</span>';
    else if (fracHTML) mainEl.innerHTML = '<span class="t-num">' + fracHTML + '</span>';
    else if (!expr) mainEl.innerHTML = '<span class="t-num">0</span><span class="caret"></span>';
    else mainEl.innerHTML = colorize(expr) + (done ? '' : '<span class="caret"></span>');

    let top = err ? errMsg : prev;
    if (!top && !done && !err && expr && !fracHTML) {
      try {
        const f = fmt(evaluate(expr));
        if (f !== expr) top = '= ' + f;
      } catch (e) { /* unfinished expression: no preview */ }
    }
    prevEl.textContent = top;

    chipAngle.textContent = mode;
    chip2nd.hidden = !second;
    chipMem.hidden = memory === 0;
    pad.classList.toggle('second', second);
    $('#k-second').classList.toggle('on', second);
    $('#k-angle').classList.toggle('on', mode === 'RAD');
    $('#k-angle .l1').textContent = mode;
    fit();
  }

  /* ================= History ================= */
  function pushHistory(e, r) {
    history.unshift({ e, r });
    history = history.slice(0, 60);
    store.set('sc-history', history);
    renderHistory();
  }
  function renderHistory() {
    hList.innerHTML = '';
    if (!history.length) {
      const d = document.createElement('div');

      b.append(e, r);
      b.addEventListener('click', () => {
        reset();
        expr = h.r; ans = toNum(h.r); done = true; prev = h.e + ' =';
        closeHistory();

      hList.appendChild(b);
    });
  }
  const openHistory = () => { historyEl.classList.add('open'); scrim.classList.add('show'); };
  const closeHistory = () => { historyEl.classList.remove('open'); scrim.classList.remove('show'); };
  $('#btnHist').addEventListener('click', openHistory);
  $('#btnCloseHist').addEventListener('click', closeHistory);

  /* ================= Toast, copy, theme ================= */
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;

    clearTimeout(toastTimer);

  }

  $('#btnCopy').addEventListener('click', () => {
    let text = '';

      if (done) text = expr;
      else if (expr) text = fmt(evaluate(expr));
    } catch (e) { text = ''; }
    if (!text) { toast('Nothing to copy'); return; }
    text = text.replace('−', '-');
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Copied ' + text); } catch (e) { toast("Couldn't copy"); }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast('Copied ' + text), fallback);
    } else fallback();
  });

  $('#btnTheme').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    store.set('sc-theme', next);
  });

  /* ================= Events ================= */
  pad.addEventListener('pointerdown', e => {
    const b = e.target.closest('.key');
    if (!b) return;
    const r = b.getBoundingClientRect();
    const d = Math.max(r.width, r.height);
    const s = document.createElement('span');
    s.className = 'ripple';
    s.style.width = s.style.height = d + 'px';
    s.style.left = (e.clientX - r.left - d / 2) + 'px';
    s.style.top = (e.clientY - r.top - d / 2) + 'px';
    b.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
    try { if (navigator.vibrate) navigator.vibrate(6); } catch (_) {}
  });

  pad.addEventListener('click', e => {
    const b = e.target.closest('.key');
    if (!b) return;
    let v = b.dataset.v;
    if (second && b.dataset.av !== undefined) { v = b.dataset.av; second = false; }
    handle(b.dataset.a, v);
  });

  const KEYMAP = {
    '0': ['in', '0'], '1': ['in', '1'], '2': ['in', '2'], '3': ['in', '3'], '4': ['in', '4'],
    '5': ['in', '5'], '6': ['in', '6'], '7': ['in', '7'], '8': ['in', '8'], '9': ['in', '9'],
    '.': ['in', '.'], ',': ['in', '.'],
    '+': ['op', '+'], '-': ['op', '−'], '*': ['op', '×'], 'x': ['op', '×'], '/': ['op', '÷'], 'm': ['op', 'mod'],
    '^': ['post', '^'], '%': ['post', '%'], '!': ['post', '!'],
    '(': ['open'], ')': ['close'],
    'p': ['const', 'π'], 'e': ['const', 'ℯ'], 'a': ['const', 'Ans'],
    's': ['fn', 'sin('], 'c': ['fn', 'cos('], 't': ['fn', 'tan('], 'l': ['fn', 'ln('], 'r': ['rootfn', '√('],
    'Enter': ['eq'], '=': ['eq'], 'Backspace': ['del'], 'Escape': ['ac'], 'Delete': ['ac']
  };

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape' && historyEl.classList.contains('open')) { closeHistory(); return; }
    const m = KEYMAP[e.key];
    if (!m) return;
    e.preventDefault();
    const [a, v] = m;
    handle(a, v);
    const sel = v !== undefined ? '[data-a="' + a + '"][data-v="' + v + '"]' : '[data-a="' + a + '"]';
    const btn = pad.querySelector(sel);
    if (btn) { btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 110); }
  });

  window.addEventListener('resize', fit);

  renderHistory();
  render();
})();
</script>
</body>
</html>
